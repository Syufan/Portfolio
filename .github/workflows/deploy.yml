name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v5

        - name: Set up JDK
          uses: actions/setup-java@v5
          with:
            java-version: "21"
            distribution: "temurin"

        - name: Set up Node.js
          uses: actions/setup-node@v5
          with:
            node-version: "18"

        - name: Checkstyle
          working-directory: ./backend
          run: ./mvnw checkstyle:check -Dcheckstyle.config.location=checkstyle.xml

        - name: Prettier
          working-directory: ./frontend
          run: |
            npm ci
            npx prettier --check .

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.11"

        - name: Install Python dependencies
          working-directory: ./chatboat
          run: |
            python -m pip install -r requirements.txt

        - name: Ruff lint
          working-directory: ./chatboat
          run: ruff check .

        - name: Run chatboat tests
          working-directory: ./chatboat
          run: pytest src/domain/test src/web/test

        - name: Run backend tests
          working-directory: ./backend
          run: ./mvnw test
